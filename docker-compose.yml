# Local development.
#
#   docker compose up            # API against the Firestore EMULATOR — no credentials
#   docker compose up api        # API against the real Firebase project (needs .env)
#
# There is no database service here any more: Firestore is managed, and the emulator
# stands in for it locally so development never touches the real project by accident.

services:
  # The Firestore emulator, from the official Firebase CLI image.
  # Data is in-memory and discarded on stop — the seeder repopulates on next boot,
  # which is exactly what you want from a scratch environment.
  firestore:
    image: node:24-alpine
    working_dir: /work
    command: >
      sh -c "npm i -g firebase-tools >/dev/null 2>&1 &&
             firebase emulators:start --only firestore
             --project aisa-local --host 0.0.0.0"
    ports:
      - "8085:8080"   # Firestore emulator
      - "4000:4000"   # Emulator UI
    healthcheck:
      # The app's seeder runs at startup and fails outright if the emulator is not
      # accepting connections yet, so the API must wait for this rather than merely
      # for the container to exist.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/", "||", "exit", "1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  api:
    build: .
    depends_on:
      firestore:
        condition: service_healthy
    environment:
      # Pointing at the emulator makes FirestoreConfig ignore credentials entirely,
      # so a misconfigured local run cannot write to the real project.
      FIRESTORE_EMULATOR_HOST: firestore:8080
      FIREBASE_PROJECT_ID: aisa-local
      SPRING_PROFILES_ACTIVE: dev
      # 3001 too: `next dev` silently falls back to the next free port when something
      # else holds 3000, and the resulting CORS failure looks like the API being down.
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      # Development-only key. Production reads JWT_SECRET from the host's secrets.
      JWT_SECRET: ZGV2ZWxvcG1lbnQtb25seS1rZXktbm90LWZvci1wcm9kdWN0aW9uLXVzZQ==
      ADMIN_BOOTSTRAP_USERNAME: AISA2026
      ADMIN_BOOTSTRAP_PASSWORD: change-me-locally
      # Image uploads stay unconfigured locally; everything else works without them.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "8080:8080"
