# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the API only. There is NO database service here: the data lives in
# Firestore, which Google hosts, so Render runs just the Java process.
#
# Point Render at this repo, choose "New > Blueprint", and set the values marked
# sync:false below.
#
# The FRONTEND is NOT here: it lives in a separate repository
# (https://github.com/Yaseenyk/SIT-FE) and is served as a static export by GitHub
# Pages. Set CORS_ALLOWED_ORIGINS below to that site's origin.

services:
  - type: web
    name: sit-be
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore          # Nearest region to Kolhapur that Render offers.
    healthCheckPath: /actuator/health
    envVars:
      # Firebase Console -> Project settings -> General.
      - key: FIREBASE_PROJECT_ID
        sync: false

      # Project settings -> Service accounts -> "Generate new private key".
      # Paste the JSON BASE64-ENCODED: the raw form contains a PEM key full of
      # newlines that this dashboard mangles, producing an "invalid key" error
      # that names nothing useful.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

      # Generated once by Render and then held. Rotating it in the dashboard
      # invalidates every issued admin token, which is the revocation mechanism.
      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ALLOWED_ORIGINS
        sync: false            # e.g. https://<github-user>.github.io

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Set once to create the first admin, then clear it and redeploy.
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

      - key: SPRING_PROFILES_ACTIVE
        value: prod
