# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the API. There is NO database service here: the data lives in Firestore,
# which Google hosts, so Render runs only the Java process.
#
# Point Render at this repo, choose "New > Blueprint", and set the values marked
# sync:false below.
#
# The FRONTEND is NOT here: it is a static export served by GitHub Pages, built
# by .github/workflows/deploy-frontend.yml. See docs/deployment.md.

services:
  - type: web
    name: aisa-api
    runtime: docker
    dockerfilePath: ./be/Dockerfile
    dockerContext: ./be
    plan: free
    region: singapore          # Nearest region to Kolhapur that Render offers.
    healthCheckPath: /actuator/health
    envVars:
      # Firebase Console -> Project settings -> General.
      - key: FIREBASE_PROJECT_ID
        sync: false

      # Project settings -> Service accounts -> Generate new private key.
      # Paste the JSON base64-encoded: the raw form contains newlines that this
      # dashboard mangles, producing an "invalid key" error that names nothing useful.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false            # e.g. https://<github-user>.github.io

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Who may sign up. The signup form is public; without this the account list
      # fills with whatever the internet sends it.
      - key: AUTH_ALLOWED_EMAIL_DOMAINS
        value: bsiet.org

      # Set both once to create the first admin, then CLEAR ADMIN_PASSWORD and
      # redeploy. Signing up can only ever produce a student, so there is no other
      # way to get the first admin onto a fresh deployment.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      - key: SPRING_PROFILES_ACTIVE
        value: prod
