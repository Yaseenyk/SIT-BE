name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # Must match <java.version> in pom.xml and the Dockerfile's base images.
          java-version: "25"
          distribution: temurin
          cache: maven

      # The Firestore emulator is a Java process shipped by the Firebase CLI, which is a
      # Node package — so both runtimes are needed even though this is a Java project.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools

      # `emulators:exec` starts the emulator, runs the command, and shuts it down —
      # including when the command fails, so a failing test cannot leave a process behind
      # and wedge the runner.
      #
      # The tests talk to the emulator, never to a real project: FirestoreConfig treats
      # FIRESTORE_EMULATOR_HOST as an absolute switch and reads no credentials when it is
      # set. There is therefore no Firebase service account in CI, and nothing here can
      # write to production data.
      #
      # No `env:` block. The emulator ports are pinned by the repository's firebase.json,
      # and Surefire passes them to the forked test JVM (see pom.xml) — which is the only
      # place FIREBASE_AUTH_EMULATOR_HOST can be set, because the Admin SDK reads it with
      # System.getenv and no code inside a running JVM can write to that.
      #
      # This step used to set FIRESTORE_EMULATOR_HOST to 8080 here, which had been wrong
      # since the port moved to 8085 and did nothing only because Surefire's value wins.
      - name: Test
        run: firebase emulators:exec --only firestore,auth --project aisa-local "mvn -B verify"

      - name: Upload test reports
        # Reports matter most when the run failed, so this must not be skipped on failure.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker:
    # Builds the image AND runs it.
    #
    # Building alone was not enough. A runtime image based on Alpine built perfectly and
    # then died with SIGSEGV on boot, because gRPC's netty-tcnative is linked against
    # glibc while Alpine ships musl. The crash is in native code, so there is no Java
    # exception and no application log — the only evidence is exit status 139. It reached
    # production precisely because this job stopped at `docker build`.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sit-be:ci .

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Port 8085, not 8080: the container publishes the API on 8080, and having the
      # emulator claim the same port would fail the smoke test for the wrong reason.
      - name: Start the Firestore and Auth emulators
        run: |
          npm install -g firebase-tools
          # The repository's own firebase.json pins these ports, so there is no --config
          # here. It used to pass one through process substitution, which firebase-tools
          # cannot open: `Could not load config file /dev/fd/63`. The emulators never
          # started, and the failure surfaced two steps later as the container being unable
          # to reach Firestore — which reads like a container problem and is not one.
          firebase emulators:start --only firestore,auth --project aisa-local &

          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8085/ >/dev/null 2>&1 && curl -fsS http://127.0.0.1:9099/ >/dev/null 2>&1; then
              echo "Both emulators are up."
              READY=1
              break
            fi
            sleep 3
          done

          # Fail HERE if they never came up, naming the cause, rather than letting the next
          # step report a connection refused it did nothing to deserve.
          if [ -z "$READY" ]; then
            echo "::error title=Emulators did not start::firestore:8085 and auth:9099 never became reachable."
            exit 1
          fi

      - name: Run the container and wait for it to serve
        run: |
          # No Firebase credentials in CI. Both emulator variables make the app skip
          # credentials entirely, so nothing can reach the real project. The auth one is read
          # by the Admin SDK itself from the environment, so it is passed to the container.
          docker run -d --name sit-be-smoke --network host \
            -e FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 \
            -e FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 \
            -e FIREBASE_PROJECT_ID=aisa-local \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            sit-be:ci

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
              echo "Container is serving. Seeded content:"
              curl -fsS http://127.0.0.1:8080/api/v1/stats
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=sit-be-smoke)" ]; then
              STATUS=$(docker inspect sit-be-smoke --format '{{.State.ExitCode}}')
              echo "::error title=Container died on startup::Exit status ${STATUS}. 139 is a native SIGSEGV, which usually means a musl/glibc mismatch in a bundled native library."
              exit 1
            fi
            sleep 3
          done
          echo "::error title=No response::The container never answered the health probe."
          exit 1

      - name: Container logs
        if: always()
        run: docker logs sit-be-smoke 2>&1 | tail -40 || true
